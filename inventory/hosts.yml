# JARVIS Ansible inventory
# gpu-02: 192.168.8.13 — perception GPU (no extra NVMe)

all:
  vars:
    ansible_user: agent
    ansible_python_interpreter: /usr/bin/python3
  children:
    cluster:
      hosts:
        ctrl-01:
          ansible_host: 192.168.8.11
          jarvis_role: control
        gpu-01:
          ansible_host: 192.168.8.12
          jarvis_role: gpu
          jarvis_gpu: chat
        gpu-02:
          ansible_host: 192.168.8.13
          jarvis_role: gpu
          jarvis_gpu: perception
        data-01:
          ansible_host: 192.168.8.14
          jarvis_role: storage
          jarvis_storage: primary
        data-02:
          ansible_host: 192.168.8.15
          jarvis_role: storage
          jarvis_storage: replica
        apps-01:
          ansible_host: 192.168.8.16
          jarvis_role: apps

    gpu:
      hosts:
        gpu-01:
        gpu-02:

    nvme:
      hosts:
        ctrl-01:
        data-01:
        data-02:
        apps-01:

    nfs_servers:
      hosts:
        data-01:

    nfs_clients:
      hosts:
        ctrl-01:
        gpu-01:
        gpu-02:
        data-02:
        apps-01:
