---
# Run AFTER k3s agent is installed on GPU nodes.
# Installs nvidia-container-toolkit; k3s auto-wires the runtime on restart.
- name: NVIDIA container runtime for k3s
  hosts: gpu
  become: true
  tasks:
    - name: NVIDIA toolkit apt key
      ansible.builtin.shell: |
        curl -fsSL https://nvidia.github.io/libnvidia-container/gpgkey \
          | gpg --dearmor -o /usr/share/keyrings/nvidia-container-toolkit-keyring.gpg
      args:
        creates: /usr/share/keyrings/nvidia-container-toolkit-keyring.gpg

    - name: NVIDIA toolkit apt list
      ansible.builtin.shell: |
        curl -fsSL https://nvidia.github.io/libnvidia-container/stable/deb/nvidia-container-toolkit.list \
          | sed 's#deb https://#deb [signed-by=/usr/share/keyrings/nvidia-container-toolkit-keyring.gpg] https://#g' \
          > /etc/apt/sources.list.d/nvidia-container-toolkit.list
      args:
        creates: /etc/apt/sources.list.d/nvidia-container-toolkit.list

    - name: Install nvidia-container-toolkit
      ansible.builtin.apt:
        name: nvidia-container-toolkit
        state: present
        update_cache: true

    - name: Enable nvidia-persistenced
      ansible.builtin.service:
        name: nvidia-persistenced
        state: started
        enabled: true
      failed_when: false

    - name: Restart k3s-agent to pick up nvidia runtime
      ansible.builtin.service:
        name: k3s-agent
        state: restarted
