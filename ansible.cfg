[defaults]
inventory = inventory/hosts.yml
roles_path = roles
remote_user = agent
interpreter_python = auto_silent
host_key_checking = False
retry_files_enabled = False
forks = 5
gathering = smart
fact_caching = jsonfile
fact_caching_connection = /tmp/jarvis-ansible-facts
fact_caching_timeout = 3600
timeout = 30
# ansible-core 2.20+: community.general.yaml callback is gone
stdout_callback = ansible.builtin.default
# silence INJECT_FACTS_AS_VARS noise; we use ansible_facts['...'] in roles
deprecation_warnings = False

[callback_default]
result_format = yaml

[privilege_escalation]
become = True
become_method = sudo
become_user = root
